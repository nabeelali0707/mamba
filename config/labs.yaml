# Registry of AI labs / companies to track.
#   rss:      feed URLs (verified at runtime; broken ones are skipped and logged)
#   hf:       Hugging Face org names (new models appear here first)
#   github:   GitHub org names (new repos / releases)
#   news:     Google News search term (universal fallback)
# Set `enabled: false` to mute a lab.

labs:
